<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Italy Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root {
  --gold:#B8912A; --gold-light:#D4AA4A; --gold-pale:#F5EDD6;
  --ink:#1A1A1A; --muted:#7A7068; --surface:#FDFAF4; --card:#FFFFFF; --line:#E8DFC8;
  --tag-free-bg:#EDF3E8; --tag-free-text:#3A6B2A;
  --tag-ticket-bg:#FDEEE8; --tag-ticket-text:#9B3A1A;
  --tag-res-bg:#FDF5E0; --tag-res-text:#7A5A00;
  --tag-dress-bg:#EEE8F5; --tag-dress-text:#5A3A8A;
  --transit-bg:#F7F4EE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}

.header{background:var(--ink);padding:48px 20px 28px;text-align:center;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(184,145,42,.18),transparent 70%);pointer-events:none;}
.header-eyebrow{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-light);margin-bottom:10px;}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(28px,7vw,42px);font-weight:700;color:#fff;line-height:1.15;margin-bottom:8px;}
.header-sub{font-size:13px;color:rgba(255,255,255,.5);font-style:italic;}
.header-rule{width:48px;height:2px;background:var(--gold);margin:16px auto 0;border-radius:1px;}

.progress-section{background:var(--ink);padding:0 20px 22px;}
.progress-track{background:rgba(255,255,255,.1);border-radius:999px;height:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--gold-light);width:0%;transition:width .4s ease;border-radius:999px;}
.progress-label{text-align:center;font-size:11px;color:rgba(255,255,255,.4);margin-top:8px;letter-spacing:.06em;text-transform:uppercase;}

.day-nav-wrap{position:sticky;top:0;z-index:100;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0 12px;}
.day-nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.day-nav::-webkit-scrollbar{display:none;}
.day-btn{flex:0 0 auto;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.55);cursor:pointer;white-space:nowrap;transition:all .18s ease;letter-spacing:.02em;}
.day-btn.active{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600;}
.day-btn:hover:not(.active){border-color:var(--gold-light);color:var(--gold-light);}

.section-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:20px 20px 8px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--line);}

.day-panel{display:none;padding-bottom:16px;}
.day-panel.active{display:block;}

/* STOP CARD */
.stop-card{margin:0 12px 2px;background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden;}
.stop-card.done{opacity:.45;}
.stop-card.done .stop-name{text-decoration:line-through;text-decoration-color:var(--gold);}
.stop-card.is-transit{background:var(--transit-bg);border-style:dashed;}
.stop-inner{display:flex;align-items:flex-start;gap:0;padding:14px 14px 14px 0;}

.stop-check{flex:0 0 46px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;}
.check-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;flex-shrink:0;}
.check-box.checked{background:var(--gold);border-color:var(--gold);}
.check-box.checked::after{content:'';display:block;width:12px;height:7px;border-left:2px solid white;border-bottom:2px solid white;transform:rotate(-45deg) translateY(-1px);}

.stop-seq{flex:0 0 28px;height:28px;border-radius:50%;background:var(--gold-pale);color:var(--gold);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;flex-shrink:0;}
.stop-seq.transit{background:transparent;color:var(--muted);font-size:15px;}

.stop-content{flex:1;min-width:0;padding-left:12px;}
.stop-time{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.stop-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);line-height:1.25;margin-bottom:5px;}
.stop-blurb{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:6px;}
.stop-address{font-size:12px;color:#2563EB;font-style:italic;margin-bottom:7px;display:flex;align-items:flex-start;gap:4px;text-decoration:none;}
.stop-address:active{opacity:.7;}

/* Walk/transit buffer */
.connector-row{display:flex;align-items:center;gap:8px;margin:0 12px 2px;padding:5px 14px 5px 58px;}
.connector-line{width:1.5px;height:24px;background:var(--line);flex-shrink:0;}
.walk-badge{font-size:11px;color:var(--muted);background:var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;display:flex;align-items:center;gap:4px;}

.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap;}
.tag-free{background:var(--tag-free-bg);color:var(--tag-free-text);}
.tag-ticket{background:var(--tag-ticket-bg);color:var(--tag-ticket-text);}
.tag-reserved{background:var(--tag-res-bg);color:var(--tag-res-text);}
.tag-dress{background:var(--tag-dress-bg);color:var(--tag-dress-text);}

/* MAP */
.map-section{margin:16px 12px 24px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.map-label{background:var(--ink);color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;display:flex;align-items:center;gap:6px;}
.day-map{height:280px;width:100%;}

.reset-wrap{text-align:center;padding:4px 20px 28px;}
.reset-btn{background:none;border:none;font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;padding:8px;}

footer{background:var(--ink);text-align:center;padding:20px;font-size:12px;color:rgba(255,255,255,.3);font-style:italic;line-height:1.7;}

.custom-pin{background:var(--gold);color:var(--ink);border:2px solid #fff;border-radius:50% 50% 50% 0;width:28px;height:28px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.custom-pin span{transform:rotate(45deg);}
</style>
</head>

const tagMeta={free:{cls:'tag-free',label:'No ticket needed'},ticket:{cls:'tag-ticket',label:'Ticket required'},reserved:{cls:'tag-reserved',label:'Reservation confirmed'},dress:{cls:'tag-dress',label:'Dress code — cover shoulders & knees'}};

function mapsUrl(a){return 'https://maps.apple.com/?q='+encodeURIComponent(a);}

let checked={};
try{const s=localStorage.getItem('italy_2026');if(s)checked=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem('italy_2026',JSON.stringify(checked));}catch(e){}}
function key(di,si){return di+'-'+si;}

function countAll(){
  let total=0,done=0;
  days.forEach((d,di)=>{
    let si2=0;
    d.stops.forEach(s=>{if(s.time!==undefined){const k=key(di,si2);total++;if(checked[k])done++;si2++;}});
  });
  return{total,done};
}

function updateProgress(){
  const{total,done}=countAll();
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=done===0?'Tap a checkbox to mark stops done':`${done} of ${total} stops complete`;
}

let maps={};

function buildDay(di){
  const day=days[di];
  const panel=document.createElement('div');
  panel.className='day-panel';
  panel.id='panel-'+di;

  const sl=document.createElement('div');
  sl.className='section-label';
  sl.textContent=day.section;
  panel.appendChild(sl);

  let seq=0,stopIdx=0;
  day.stops.forEach((stop,rawIdx)=>{
    if(stop.walk!==undefined){
      // Walk/transit connector
      const row=document.createElement('div');
      row.className='connector-row';
      row.innerHTML=`<div class="connector-line"></div><div class="walk-badge">${stop.transit?'🚆':'🚶'} ${stop.walk}</div>`;
      panel.appendChild(row);
      return;
    }

    const si=stopIdx++;
    if(!stop.transit) seq++;
    const k=key(di,si);
    const isDone=!!checked[k];

    const card=document.createElement('div');
    card.className='stop-card'+(stop.transit?' is-transit':'')+(isDone?' done':'');

    const inner=document.createElement('div');
    inner.className='stop-inner';

    // Checkbox
    const checkWrap=document.createElement('div');
    checkWrap.className='stop-check';
    const box=document.createElement('div');
    box.className='check-box'+(isDone?' checked':'');
    box.addEventListener('click',()=>{checked[k]=!checked[k];save();renderDay(di);updateProgress();});
    checkWrap.appendChild(box);

    const seqEl=document.createElement('div');
    seqEl.className='stop-seq'+(stop.transit?' transit':'');
    seqEl.textContent=stop.transit?'↓':seq;

    const content=document.createElement('div');
    content.className='stop-content';

    if(stop.time){const t=document.createElement('div');t.className='stop-time';t.textContent=stop.time;content.appendChild(t);}
    const name=document.createElement('div');name.className='stop-name';name.textContent=stop.name;content.appendChild(name);
    if(stop.blurb){const b=document.createElement('div');b.className='stop-blurb';b.textContent=stop.blurb;content.appendChild(b);}
    if(stop.address){const a=document.createElement('a');a.className='stop-address';a.href=mapsUrl(stop.address);a.innerHTML='<span>📍</span>'+stop.address;content.appendChild(a);}
    if(stop.tags&&stop.tags.length){
      const tr=document.createElement('div');tr.className='tags';
      stop.tags.forEach(t=>{if(!tagMeta[t])return;const tg=document.createElement('span');tg.className='tag '+tagMeta[t].cls;tg.textContent=tagMeta[t].label;tr.appendChild(tg);});
      content.appendChild(tr);
    }

    inner.appendChild(checkWrap);inner.appendChild(seqEl);inner.appendChild(content);
    card.appendChild(inner);panel.appendChild(card);
  });

  // MAP
  const mapSection=document.createElement('div');
  mapSection.className='map-section';
  const mapLabel=document.createElement('div');
  mapLabel.className='map-label';
  mapLabel.innerHTML='🗺️ &nbsp;Day map — tap a pin for details';
  mapSection.appendChild(mapLabel);
  const mapDiv=document.createElement('div');
  mapDiv.className='day-map';
  mapDiv.id='map-'+di;
  mapSection.appendChild(mapDiv);
  panel.appendChild(mapSection);

  return panel;
}

function initMap(di){
  if(maps[di]) return;
  const day=days[di];
  const pts=day.stops.filter(s=>s.lat&&s.lng&&!s.walk);
  if(!pts.length) return;
  const center=[pts[0].lat,pts[0].lng];
  const m=L.map('map-'+di,{scrollWheelZoom:false,zoomControl:true}).setView(center,14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  const lls=[];
  let seq=0;
  pts.forEach(s=>{
    if(!s.transit) seq++;
    const pin=L.divIcon({className:'',html:`<div class="custom-pin"><span>${s.transit?'→':seq}</span></div>`,iconSize:[28,28],iconAnchor:[14,26]});
    L.marker([s.lat,s.lng],{icon:pin}).addTo(m).bindPopup(`<b>${s.name}</b>${s.time?'<br><small>'+s.time+'</small>':''}`);
    lls.push([s.lat,s.lng]);
  });
  if(lls.length>1) L.polyline(lls,{color:'#B8912A',weight:2,dashArray:'5,7',opacity:.8}).addTo(m);
  m.fitBounds(lls,{padding:[28,28]});
  maps[di]=m;
}

function renderDay(di){
  const existing=document.getElementById('panel-'+di);
  const newP=buildDay(di);
  if(existing){
    const wasActive=existing.classList.contains('active');
    newP.className='day-panel'+(wasActive?' active':'');
    existing.replaceWith(newP);
    if(wasActive) setTimeout(()=>initMap(di),100);
  } else {
    document.getElementById('panels').appendChild(newP);
  }
}

function switchDay(di){
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.day-btn').forEach((b,i)=>b.classList.toggle('active',i===di));
  const panel=document.getElementById('panel-'+di);
  if(panel){
    panel.classList.add('active');
    const btn=document.querySelectorAll('.day-btn')[di];
    if(btn) btn.scrollIntoView({inline:'center',behavior:'smooth'});
    setTimeout(()=>initMap(di),150);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

const nav=document.getElementById('dayNav');
const panelsEl=document.getElementById('panels');

days.forEach((day,di)=>{
  const btn=document.createElement('button');
  btn.className='day-btn'+(di===0?' active':'');
  btn.textContent=day.label;
  btn.addEventListener('click',()=>switchDay(di));
  nav.appendChild(btn);
  const panel=buildDay(di);
  if(di===0) panel.classList.add('active');
  panelsEl.appendChild(panel);
});

document.getElementById('resetBtn').addEventListener('click',()=>{checked={};save();days.forEach((_,di)=>renderDay(di));updateProgress();});

setTimeout(()=>initMap(0),200);
updateProgress();
</script>
